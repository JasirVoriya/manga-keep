name: Build Mobile Release Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Type check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Generate Android native project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "dist/comic-guests-${{ inputs.version }}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/comic-guests-${{ inputs.version }}.apk

  build-ios-unsigned-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Type check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Generate iOS native project
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Build unsigned iOS app
        working-directory: mobile
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | ruby -rjson -e 'puts JSON.parse(STDIN.read)["workspace"]["schemes"].first')

          echo "Using workspace: $WORKSPACE"
          echo "Using scheme: $SCHEME"

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        working-directory: mobile
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/ios-build/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" -type d -print -quit)
          test -n "$APP_PATH" || (echo "No .app bundle found" && exit 1)

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          mkdir -p dist
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/mobile/dist/comic-guests-${{ inputs.version }}-unsigned.ipa" Payload)

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: mobile/dist/comic-guests-${{ inputs.version }}-unsigned.ipa

  publish-release:
    needs:
      - build-android-apk
      - build-ios-unsigned-ipa
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ inputs.version }}" --yes --cleanup-tag || true
          git tag -f "${{ inputs.version }}"
          git push origin "${{ inputs.version }}" --force

          mapfile -t ASSETS < <(find dist -type f \( -name "*.apk" -o -name "*.ipa" \) -print | sort)

          gh release create "${{ inputs.version }}" "${ASSETS[@]}" \
            --title "Comic Guests ${{ inputs.version }}" \
            --notes "Android release APK and unsigned iOS IPA built by GitHub Actions. The APK can be installed directly on Android. The IPA is unsigned and must be signed before installing on iOS devices."
